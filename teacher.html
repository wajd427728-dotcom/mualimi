<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المعلم - مدرسة الذاريات الابتدائية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .uppercase-input { text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-4">

    <!-- شاشة تسجيل الدخول الإدارية الآمنة -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-amber-500/60 w-full max-w-sm rounded-3xl p-6 text-center space-y-5 shadow-2xl">
            <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner border border-amber-500/40">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="space-y-1">
                <h2 class="text-base font-black text-white">بوابة المعلم الإلكترونية</h2>
                <p class="text-[11px] text-slate-400">أدخل كود المعلم السري للوصول إلى لوحة التحكم.</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="teacher-secret-code" placeholder="أدخل الكود السري..." class="w-full bg-slate-950 border-2 border-slate-700 rounded-2xl p-3.5 text-center text-white font-mono font-black tracking-widest text-sm focus:border-amber-400 outline-none transition shadow-inner">
                <button onclick="verifyTeacherLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-3.5 rounded-2xl text-xs shadow-xl transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key"></i> دخول آمن للنظام 🔓
                </button>
            </div>
        </div>
    </div>

    <!-- رأس لوحة التحكم -->
    <header class="w-full max-w-md bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-4 shadow-xl flex justify-between items-center mb-4">
        <button onclick="teacherLogout()" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow">
            <i class="fa-solid fa-right-from-bracket"></i> قفل
        </button>
        
        <div class="text-center space-y-0.5">
            <span class="text-[9px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-bold">لوحة المعلم الآمنة</span>
            <h1 class="text-sm font-black text-amber-400">مدرسة الذاريات الابتدائية</h1>
            <p class="text-[11px] font-bold text-slate-300">المعلم حيدر محمد عبد الكريم</p>
        </div>

        <div id="live-clock" class="text-xs font-mono font-black text-amber-300 bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-700 shadow-inner">
            00:00
        </div>
    </header>

    <main class="w-full max-w-md space-y-4">
        <!-- التبويبات الرئيسية -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
            <h2 class="text-sm font-bold text-amber-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> التبويبات الرئيسية
            </h2>
            <div class="grid grid-cols-4 gap-1.5 text-center text-xs mb-2">
                <button onclick="switchTeacherTab('notifications')" id="t-tab-notifications" class="p-2 rounded-xl bg-amber-500 text-slate-950 font-bold transition text-[10px] flex items-center justify-center gap-1">
                    <i class="fa-solid fa-bell"></i> 🔔 إشعارات (<span id="notif-count">0</span>)
                </button>
                <button onclick="switchTeacherTab('parentinbox')" id="t-tab-parentinbox" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">📥 رسائل الأهل (<span id="inbox-count">0</span>)</button>
                <button onclick="switchTeacherTab('homework')" id="t-tab-homework" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">📖 الواجبات</button>
                <button onclick="switchTeacherTab('grades')" id="t-tab-grades" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">سجل الدرجات</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
                <button onclick="switchTeacherTab('students')" id="t-tab-students" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">التلاميذ</button>
                <button onclick="switchTeacherTab('mybook')" id="t-tab-mybook" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">📌 مفكرتي</button>
                <button onclick="switchTeacherTab('honor')" id="t-tab-honor" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">🌟 الشرف</button>
                <button onclick="switchTeacherTab('quiz')" id="t-tab-quiz" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">❓ اختبار</button>
                <button onclick="switchTeacherTab('certificate')" id="t-tab-certificate" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">🏆 شهادة</button>
                <button onclick="switchTeacherTab('guidance')" id="t-tab-guidance" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">💌 توجيه</button>
                <button onclick="switchTeacherTab('behavior')" id="t-tab-behavior" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">⭐ سلوكي</button>
            </div>
        </div>

        <!-- تبويب: إشعارات وإجابات التلاميذ -->
        <div id="teacher-tab-notifications" class="space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-bell"></i> سجل تفاعلات وإجابات التلاميذ 🔔</h3>
                    <button onclick="clearNotifications()" class="text-[10px] bg-red-900/50 hover:bg-red-800 text-red-300 px-2 py-1 rounded">مسح السجل 🗑️</button>
                </div>
                <div id="notifications-list-container" class="space-y-2 max-h-70 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: رسائل أولياء الأمور الواردة -->
        <div id="teacher-tab-parentinbox" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-inbox"></i> رسائل واستفسارات أولياء الأمور 📥</h3>
                    <button onclick="clearParentInboxes()" class="text-[10px] bg-red-900/50 hover:bg-red-800 text-red-300 px-2 py-1 rounded">حذف الكل 🗑️</button>
                </div>
                <div id="teacher-parentinbox-container" class="space-y-2 max-h-75 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: إدارة التلاميذ -->
        <div id="teacher-tab-students" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-4">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-user-plus"></i> إدخال التلاميذ</h3>
                <div class="bg-slate-900/70 p-3 rounded-xl border border-slate-700 space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="new-student-class" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white"><option value="السادس الابتدائي">السادس</option><option value="الخامس الابتدائي">الخامس</option></select>
                        <select id="new-student-section" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white"><option value="أ">شعبة أ</option><option value="ب">شعبة ب</option></select>
                    </div>
                    <input type="text" id="new-student-name" placeholder="اسم التلميذ الثلاثي..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    <button onclick="addNewStudent()" class="w-full bg-amber-500 text-slate-950 font-bold p-2 rounded-lg text-xs">حفظ وتوليد كود الدخول ➕</button>
                </div>
                <div id="teacher-students-list" class="space-y-2 max-h-45 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: سجل الدرجات -->
        <div id="teacher-tab-grades" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-4">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-graduation-cap"></i> سجل درجات التلاميذ</h3>
                <select id="grade-student-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white"><option value="">اختر التلميذ...</option></select>
                <div id="grade-inputs-container" class="space-y-4 hidden">
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-3">
                        <h4 class="text-xs font-bold text-amber-400 border-b border-slate-700 pb-1.5">📊 السجل الإداري</h4>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div><label class="text-[10px] text-slate-400">تشرين الأول:</label><input type="number" id="g-oct" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></div>
                            <div><label class="text-[10px] text-slate-400">تشرين الثاني:</label><input type="number" id="g-nov" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></div>
                            <div><label class="text-[10px] text-slate-400">كانون الأول:</label><input type="number" id="g-dec" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></div>
                            <div><label class="text-[10px] text-slate-400">كانون الثاني:</label><input type="number" id="g-jan" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                            <div><label class="text-[10px] text-amber-300">معدل الأول:</label><input type="number" id="g-mid-avg" class="w-full bg-slate-800 border border-amber-500/50 rounded-lg p-2 text-white font-bold"></div>
                            <div><label class="text-[10px] text-amber-300">نصف السنة:</label><input type="number" id="g-mid" class="w-full bg-slate-800 border border-amber-500/50 rounded-lg p-2 text-white font-bold"></div>
                        </div>
                    </div>
                    <button onclick="saveStudentGrades()" class="w-full bg-amber-500 text-slate-950 font-bold p-3 rounded-xl text-xs">حفظ الدرجات 💾</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ADMIN_SECRET_CODE = "1122";

        let studentsData = JSON.parse(localStorage.getItem('dhariyat_students')) || [];
        let homeworkData = JSON.parse(localStorage.getItem('dhariyat_homework')) || [];
        let messagesData = JSON.parse(localStorage.getItem('dhariyat_messages')) || [];
        let behaviorData = JSON.parse(localStorage.getItem('dhariyat_behavior')) || {};
        let honorData = JSON.parse(localStorage.getItem('dhariyat_honor')) || [];
        let quizData = JSON.parse(localStorage.getItem('dhariyat_quiz')) || [];
        let notificationsData = JSON.parse(localStorage.getItem('dhariyat_notifications')) || [];
        let parentInboxesData = JSON.parse(localStorage.getItem('dhariyat_parent_inboxes')) || [];

        window.onload = function() {
            const isAuthorized = sessionStorage.getItem('dhariyat_admin_logged');
            if(isAuthorized === 'true') {
                document.getElementById('teacher-login-modal').classList.add('hidden');
                initTeacherDashboard();
            } else {
                document.getElementById('teacher-login-modal').classList.remove('hidden');
            }
            updateLiveClock();
            setInterval(updateLiveClock, 1000);
        };

        function updateLiveClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('live-clock');
            if(clockEl) clockEl.innerText = `${hours}:${minutes}:${seconds}`;
        }

        function verifyTeacherLogin() {
            const enteredCode = document.getElementById('teacher-secret-code').value.trim();
            if(enteredCode === ADMIN_SECRET_CODE) {
                sessionStorage.setItem('dhariyat_admin_logged', 'true');
                document.getElementById('teacher-login-modal').classList.add('hidden');
                initTeacherDashboard();
            } else {
                alert('كود الدخول السري غير صحيح!');
                document.getElementById('teacher-secret-code').value = '';
            }
        }

        function teacherLogout() {
            sessionStorage.removeItem('dhariyat_admin_logged');
            location.reload();
        }

        function initTeacherDashboard() {
            switchTeacherTab('notifications');
            saveData();
        }

        function saveData() {
            localStorage.setItem('dhariyat_students', JSON.stringify(studentsData));
            // 🌟 تحديث السجل العام المشترك تلقائياً ليزامنه نظام ولي الأمر
            localStorage.setItem('dhariyat_global_students', JSON.stringify(studentsData));
            
            localStorage.setItem('dhariyat_homework', JSON.stringify(homeworkData));
            localStorage.setItem('dhariyat_messages', JSON.stringify(messagesData));
            localStorage.setItem('dhariyat_behavior', JSON.stringify(behaviorData));
            localStorage.setItem('dhariyat_honor', JSON.stringify(honorData));
            localStorage.setItem('dhariyat_quiz', JSON.stringify(quizData));
            localStorage.setItem('dhariyat_notifications', JSON.stringify(notificationsData));
            localStorage.setItem('dhariyat_parent_inboxes', JSON.stringify(parentInboxesData));

            renderStudentsList();
            renderNotificationsList();
            renderParentInboxes();
        }

        function switchTeacherTab(tab) {
            ['students', 'grades', 'homework', 'guidance', 'behavior', 'certificate', 'honor', 'quiz', 'notifications', 'parentinbox'].forEach(t => {
                const el = document.getElementById(`teacher-tab-${t}`);
                const btn = document.getElementById(`t-tab-${t}`);
                if(el) el.classList.add('hidden');
                if(btn) btn.className = "p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]";
            });
            const targetEl = document.getElementById(`teacher-tab-${tab}`);
            if(targetEl) targetEl.classList.remove('hidden');
            const activeBtn = document.getElementById(`t-tab-${tab}`);
            if(activeBtn) activeBtn.className = "p-2 rounded-xl bg-amber-500 text-slate-950 font-bold transition text-[9px]";

            if(tab === 'grades') populateGradeSelect();
        }

        function addNewStudent() {
            const name = document.getElementById('new-student-name').value.trim();
            if(!name) { alert('أدخل اسم التلميذ.'); return; }
            const id = 'STU-' + Math.floor(1000 + Math.random() * 9000);
            studentsData.push({ id, name, class: document.getElementById('new-student-class').value, section: document.getElementById('new-student-section').value });
            document.getElementById('new-student-name').value = ''; 
            saveData(); 
            alert(`تم الحفظ بنجاح! كود التلميذ هو: ${id}`);
        }

        function renderStudentsList() {
            const c = document.getElementById('teacher-students-list');
            if(!c) return; c.innerHTML = '';
            studentsData.forEach((s, idx) => { 
                c.innerHTML += `<div class="p-2.5 bg-slate-900 border border-slate-700 rounded-xl flex justify-between text-xs items-center"><span><b>${s.name}</b> (${s.id})</span><button onclick="studentsData.splice(${idx},1);saveData();" class="text-red-400 hover:text-red-300">🗑️ حذف</button></div>`; 
            });
        }

        function populateGradeSelect() {
            const select = document.getElementById('grade-student-select');
            if(!select) return; select.innerHTML = '<option value="">اختر التلميذ...</option>';
            studentsData.forEach(s => { select.innerHTML += `<option value="${s.id}">${s.name} (${s.class} - شعبة ${s.section})</option>`; });
        }

        document.getElementById('grade-student-select')?.addEventListener('change', function() {
            const s = studentsData.find(x => x.id === this.value);
            const container = document.getElementById('grade-inputs-container');
            if(!s) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            document.getElementById('g-oct').value = s.oct || '';
            document.getElementById('g-nov').value = s.nov || '';
            document.getElementById('g-dec').value = s.dec || '';
            document.getElementById('g-jan').value = s.jan || '';
            document.getElementById('g-mid-avg').value = s.midAvg || '';
            document.getElementById('g-mid').value = s.mid || '';
        });

        function saveStudentGrades() {
            const s = studentsData.find(x => x.id === document.getElementById('grade-student-select').value);
            if(s) {
                s.oct = document.getElementById('g-oct').value; 
                s.nov = document.getElementById('g-nov').value;
                s.dec = document.getElementById('g-dec').value; 
                s.jan = document.getElementById('g-jan').value;
                s.midAvg = document.getElementById('g-mid-avg').value; 
                s.mid = document.getElementById('g-mid').value;
                saveData(); 
                alert('تم حفظ الدرجات وتحديث المزامنة بنجاح 💾');
            }
        }

        function renderNotificationsList() {
            const c = document.getElementById('notifications-list-container');
            if(!c) return; c.innerHTML = '';
            document.getElementById('notif-count').innerText = notificationsData.length;
            if(notificationsData.length === 0) {
                c.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">لا توجد إشعارات حتى الآن.</p>';
            } else {
                notificationsData.forEach((n) => {
                    c.innerHTML += `<div class="p-3 bg-slate-900 border rounded-xl text-xs"><b>${n.studentName}:</b> أجاب على السؤال (${n.chosenText}) - ${n.isCorrect ? 'صح 🌟' : 'خطأ ❌'}</div>`;
                });
            }
        }

        function clearNotifications() { notificationsData = []; saveData(); }
        function renderParentInboxes() {
            const c = document.getElementById('teacher-parentinbox-container');
            if(!c) return; document.getElementById('inbox-count').innerText = parentInboxesData.length;
            c.innerHTML = parentInboxesData.length === 0 ? '<p class="text-xs text-slate-400 text-center py-6">لا توجد رسائل واردة.</p>' : parentInboxesData.map((m, i) => `<div class="p-3 bg-slate-900 border rounded-xl text-xs"><b>${m.studentName}:</b> ${m.title} <button onclick="parentInboxesData.splice(${i},1);saveData();" class="text-red-400 float-left">حذف</button></div>`).join('');
        }
        function clearParentInboxes() { parentInboxesData = []; saveData(); }
    </script>
</body>
</html>
