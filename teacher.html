<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المعلم - مدرسة الذاريات الابتدائية</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-4">

    <header class="w-full max-w-md bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-4 mb-4 shadow-xl text-center">
        <span class="text-xs bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full font-bold">لوحة تحكم المعلم والمرشد</span>
        <h1 class="text-xl font-black text-amber-400 mt-2">مدرسة الذاريات الابتدائية</h1>
        <p class="text-sm text-slate-300 mt-1">أ. حيدر محمد عبد الكريم</p>
    </header>

    <main class="w-full max-w-md space-y-4">
        <!-- التبويبات الرئيسية -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
            <h2 class="text-sm font-bold text-amber-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> التبويبات الرئيسية
            </h2>
            <div class="grid grid-cols-4 gap-1.5 text-center text-xs mb-2">
                <button onclick="switchTeacherTab('notifications')" id="t-tab-notifications" class="p-2 rounded-xl bg-amber-500 text-slate-950 font-bold transition text-[10px] flex items-center justify-center gap-1">
                    <i class="fa-solid fa-bell"></i> 🔔 إشعارات (<span id="notif-count">0</span>)
                </button>
                <button onclick="switchTeacherTab('homework')" id="t-tab-homework" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">📖 الواجبات</button>
                <button onclick="switchTeacherTab('grades')" id="t-tab-grades" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">سجل الدرجات</button>
                <button onclick="switchTeacherTab('students')" id="t-tab-students" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[10px]">إدارة التلاميذ</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
                <button onclick="switchTeacherTab('mybook')" id="t-tab-mybook" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">📌 مفكرتي</button>
                <button onclick="switchTeacherTab('honor')" id="t-tab-honor" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">🌟 الشرف</button>
                <button onclick="switchTeacherTab('quiz')" id="t-tab-quiz" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">❓ اختبار</button>
                <button onclick="switchTeacherTab('certificate')" id="t-tab-certificate" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">🏆 شهادة</button>
                <button onclick="switchTeacherTab('guidance')" id="t-tab-guidance" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">💌 توجيه</button>
                <button onclick="switchTeacherTab('behavior')" id="t-tab-behavior" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">⭐ سلوكي</button>
                <button onclick="switchTeacherTab('schedule')" id="t-tab-schedule" class="p-2 rounded-xl bg-slate-700 text-slate-300 font-bold transition text-[9px]">📚 دروسي</button>
            </div>
        </div>

        <!-- تبويب: إشعارات وإجابات التلاميذ -->
        <div id="teacher-tab-notifications" class="space-y-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-bell"></i> سجل تفاعلات وإجابات التلاميذ 🔔</h3>
                    <button onclick="clearNotifications()" class="text-[10px] bg-red-900/50 hover:bg-red-800 text-red-300 px-2 py-1 rounded">مسح السجل 🗑️</button>
                </div>
                <div id="notifications-list-container" class="space-y-2 max-h-70 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: لوحة الشرف -->
        <div id="teacher-tab-honor" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-medal"></i> إضافة تلميذ إلى لوحة الشرف 🌟</h3>
                <div class="space-y-2.5 bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-xs">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">اختر التلميذ المتفوق:</label>
                        <select id="honor-student-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white font-bold"><option value="">اختر التلميذ...</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">سبب التكريم / الإنجاز:</label>
                        <input type="text" id="honor-reason" placeholder="مثال: الحصول على الدرجة الكاملة..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
                    </div>
                    <button onclick="addHonorStudent()" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl">إضافة إلى لوحة الشرف العامة 🏅</button>
                </div>
                <div id="honor-list-container" class="space-y-2 max-h-45 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: الاختبارات -->
        <div id="teacher-tab-quiz" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-circle-question"></i> نشر سؤال تفاعلي أو اختبار قصير ❓</h3>
                <div class="space-y-2.5 bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="quiz-class" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"><option value="السادس الابتدائي">السادس</option><option value="الخامس الابتدائي">الخامس</option><option value="الجميع">كافة الصفوف</option></select>
                        <select id="quiz-sub" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold"><option value="التربية الإسلامية">التربية الإسلامية</option><option value="اللغة العربية">اللغة العربية</option></select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">نص السؤال:</label>
                        <textarea id="quiz-question" rows="2" placeholder="اكتب السؤال هنا..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="quiz-opt1" placeholder="الخيار أ..." class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
                        <input type="text" id="quiz-opt2" placeholder="الخيار ب..." class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="text-[10px] text-amber-400 block mb-1">الخيار الصحيح:</label>
                        <select id="quiz-correct" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold"><option value="1">الخيار (أ)</option><option value="2">الخيار (ب)</option></select>
                    </div>
                    <button onclick="publishQuiz()" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl">نشر السؤال للبوابة التفاعلية 🚀</button>
                </div>
                <div id="quiz-list-container" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: مفكرتي -->
        <div id="teacher-tab-mybook" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-book-bookmark"></i> مفكرتي الشخصية 📌</h3>
                <div class="space-y-2.5 bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="my-day" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
                            <option value="السبت">السبت</option><option value="الأحد">الأحد</option><option value="الإثنين">الإثنين</option><option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option><option value="الخميس">الخميس</option>
                        </select>
                        <input type="text" id="my-date" placeholder="التاريخ..." class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-center font-mono">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="my-class" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"><option value="السادس الابتدائي">السادس</option><option value="الخامس الابتدائي">الخامس</option></select>
                        <select id="my-section" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"><option value="أ">شعبة أ</option><option value="ب">شعبة ب</option></select>
                    </div>
                    <select id="my-sub" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold"><option value="التربية الإسلامية">التربية الإسلامية</option><option value="اللغة العربية">اللغة العربية</option></select>
                    <input type="text" id="my-title" placeholder="عنوان الدرس أو المذكرة..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold">
                    <textarea id="my-notes" rows="2" placeholder="تفاصيل..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></textarea>
                    <button onclick="addMyNote()" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl">حفظ في مفكرتي 📌</button>
                </div>
                <div id="mybook-list-container" class="space-y-2 max-h-45 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: الواجبات -->
        <div id="teacher-tab-homework" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-book-open-reader"></i> نشر الواجبات المدرسية 📖</h3>
                <div class="space-y-2.5 bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="hw-class" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"><option value="السادس الابتدائي">السادس</option><option value="الخامس الابتدائي">الخامس</option><option value="الجميع">كافة الصفوف</option></select>
                        <select id="hw-section" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"><option value="أ">شعبة أ</option><option value="ب">شعبة ب</option><option value="الجميع">كافة الشعب</option></select>
                    </div>
                    <select id="hw-sub" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold"><option value="التربية الإسلامية">التربية الإسلامية</option><option value="اللغة العربية">اللغة العربية</option></select>
                    <input type="text" id="hw-title" placeholder="عنوان الواجب..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
                    <textarea id="hw-notes" rows="2" placeholder="التفاصيل..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></textarea>
                    <button onclick="publishHomework()" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl">نشر الواجب 🚀</button>
                </div>
                <div id="homework-list-container" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- تبويب: سلوكي -->
        <div id="teacher-tab-behavior" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-star"></i> التقييم السلوكي نحو الـ 100 ⭐</h3>
                <div class="space-y-2.5 bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-xs">
                    <select id="beh-student-select" onchange="loadStudentBehavior()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white font-bold"><option value="">اختر التلميذ...</option></select>
                    <div class="flex items-center gap-3">
                        <input type="range" id="beh-score-range" min="0" max="100" value="95" oninput="document.getElementById('beh-score-val').innerText=this.value" class="w-full accent-amber-500 cursor-pointer">
                        <span id="beh-score-val" class="text-amber-400 font-black text-sm bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">95</span>
                    </div>
                    <textarea id="beh-note" rows="3" placeholder="رسالة التشجيع..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white"></textarea>
                    <button onclick="saveStudentBehavior()" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded-xl">حفظ وإرسال التقييم 🚀</button>
                </div>
            </div>
        </div>

        <!-- تبويب: توجيه -->
        <div id="teacher-tab-guidance" class="space-y-4 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
                <h3 class="font-bold text-sm text-amber-400"><i class="fa-solid fa-envelope-
